<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TrustEscrow">
  <rect width="256" height="256" rx="56" fill="#0B1D2A"/>
  <!-- Two arcs: the buyer and the seller, each holding half of the trade. -->
  <g fill="none" stroke-linecap="round" stroke-width="18">
    <path d="M128 52a76 76 0 0 1 0 152" stroke="#34D399"/>
    <path d="M128 204a76 76 0 0 1 0-152" stroke="#F8FAFC" opacity="0.92"/>
  </g>
  <!-- The delivery code: the key that closes the circle. -->
  <circle cx="128" cy="128" r="26" fill="#34D399"/>
  <rect x="122" y="128" width="12" height="30" rx="6" fill="#0B1D2A"/>
  <circle cx="128" cy="122" r="11" fill="#0B1D2A"/>
</svg>
